# Konfigurasi NGINX untuk Forum API
# Salin ke /etc/nginx/sites-available/forum-api lalu aktifkan (lihat PANDUAN-DEPLOY.md).
# Ganti api.example.com dengan domain Anda, kemudian jalankan certbot untuk HTTPS:
#   sudo certbot --nginx -d api.example.com

# Limit access: 90 request per menit per alamat IP (zona ini hanya dipakai di /threads).
limit_req_zone $binary_remote_addr zone=forum_threads:10m rate=90r/m;

server {
    listen 80;
    server_name api.example.com;

    # Resource /threads dan seluruh path di dalamnya dibatasi.
    location /threads {
        limit_req zone=forum_threads burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resource lain (users, authentications) tidak dibatasi.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
