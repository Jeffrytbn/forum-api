name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    # Database PostgreSQL lokal (service container) untuk integration & functional test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U developer -d forumapi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST_TEST: localhost
      PGPORT_TEST: 5432
      PGUSER_TEST: developer
      PGPASSWORD_TEST: supersecretpassword
      PGDATABASE_TEST: forumapi_test
      ACCESS_TOKEN_KEY: ci_access_token_key_hanya_untuk_pengujian
      REFRESH_TOKEN_KEY: ci_refresh_token_key_hanya_untuk_pengujian
      ACCESS_TOKEN_AGE: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate test database
        run: npm run migrate:test up

      - name: Run unit, integration, and functional tests
        run: npm test
